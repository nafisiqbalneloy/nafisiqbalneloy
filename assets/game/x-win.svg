<svg xmlns="http://www.w3.org/2000/svg" width="104" height="104" viewBox="0 0 104 104" role="img">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b2433"/><stop offset="1" stop-color="#0f1520"/>
  </linearGradient>
</defs>
<rect x="3" y="3" width="98" height="98" rx="16" fill="url(#tile)" stroke="#3fb950" stroke-width="2"><animate attributeName="stroke" values="#3fb950;#a6ffb5;#3fb950" dur="1.2s" repeatCount="indefinite"/></rect>
  <g filter="url(#glow)" stroke="#ff4d6d" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="30" y1="30" x2="74" y2="74" stroke-dasharray="63" stroke-dashoffset="63"><animate attributeName="stroke-dashoffset" from="63" to="0" begin="0s" dur="0.35s" fill="freeze"/></line>
    <line x1="74" y1="30" x2="30" y2="74" stroke-dasharray="63" stroke-dashoffset="63"><animate attributeName="stroke-dashoffset" from="63" to="0" begin="0.3s" dur="0.35s" fill="freeze"/></line>
    <g><animateTransform attributeName="transform" type="scale" additive="sum" values="1;1.08;1" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></g>
  </g>
</svg>
