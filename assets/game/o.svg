<svg xmlns="http://www.w3.org/2000/svg" width="104" height="104" viewBox="0 0 104 104" role="img">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b2433"/><stop offset="1" stop-color="#0f1520"/>
  </linearGradient>
</defs>
<rect x="3" y="3" width="98" height="98" rx="16" fill="url(#tile)" stroke="#1f4a5c" stroke-width="2"></rect>
  <g filter="url(#glow)">
    <circle cx="52" cy="52" r="24" fill="none" stroke="#4cc9f0" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="151" stroke-dashoffset="151" transform="rotate(-90 52 52)"><animate attributeName="stroke-dashoffset" from="151" to="0" begin="0s" dur="0.6s" fill="freeze"/></circle>
  </g>
</svg>
