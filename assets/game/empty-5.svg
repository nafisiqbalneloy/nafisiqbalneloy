<svg xmlns="http://www.w3.org/2000/svg" width="104" height="104" viewBox="0 0 104 104" role="img">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b2433"/><stop offset="1" stop-color="#0f1520"/>
  </linearGradient>
</defs>
<rect x="3" y="3" width="98" height="98" rx="16" fill="url(#tile)" stroke="#3b4a63" stroke-width="2"><animate attributeName="stroke" values="#3b4a63;#58a6ff;#3b4a63" dur="2.6s" repeatCount="indefinite"/></rect>
  <text x="52" y="64" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#58a6ff" opacity="0.55">5
    <animate attributeName="opacity" values="0.35;0.8;0.35" dur="2.6s" repeatCount="indefinite"/>
  </text>
</svg>
