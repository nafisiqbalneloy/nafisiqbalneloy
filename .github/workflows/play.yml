name: Play Tic-Tac-Toe

on:
  issues:
    types: [opened]

# One move at a time so two visitors never overwrite each other.
concurrency:
  group: tic-tac-toe
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  move:
    # Only react to game issues; every other issue is ignored.
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the game engine tests
        run: node --test

      - name: Apply the move
        env:
          # Passed through the environment, never interpolated into a shell command.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: node game/play.js

      - name: Commit the new board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          if git diff --cached --quiet; then
            echo "No board change"
          else
            git commit -m "game: ${{ github.event.issue.user.login }} played"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push
          fi

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file game/result.txt
          gh issue close "$ISSUE_NUMBER" --reason completed
